<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificate — CODEMIND</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="certificate">
<div id="siteNav"></div>

<main>
  <div class="container page-head">
    <h1><i class="bi bi-award-fill text-warning"></i> Certificate of Completion</h1>
    <p class="text-secondary mb-0">Unlocks when you finish all 9 tracks and 4 systems. This certificate is issued by the CODEMIND platform as proof of the training you completed.</p>
  </div>
  <section class="py-4">
    <div class="container">
      <div class="card mb-3"><div class="card-body">
        <label for="certName" class="form-label small text-secondary">Name printed on the certificate</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input id="certName" type="text" class="form-control" maxlength="40" placeholder="Enter your full name">
          <button id="certSaveName" class="btn btn-info">Save</button>
        </div>
        <div class="d-flex justify-content-between small mt-3 mb-1"><span>Tracks passed</span><span id="certProgText">0/13</span></div>
        <div class="progress" style="height:10px"><div id="certProgBar" class="progress-bar bg-success" style="width:0%"></div></div>
      </div></div>

      <div id="certLocked" class="alert alert-secondary"><i class="bi bi-lock-fill"></i> <span id="certLockText"></span> <a href="tracks.html" class="alert-link">Go to tracks</a></div>
      <div id="certUnlocked" class="d-none">
        <div class="cert-wrap mb-3"><canvas id="certCanvas" width="1600" height="1100"></canvas></div>
        <div class="d-flex flex-wrap gap-2">
          <button id="certDownload" class="btn btn-lg btn-neon"><i class="bi bi-download"></i> Download Certificate (PNG)</button>
          <button id="certPrint" class="btn btn-lg btn-outline-info"><i class="bi bi-printer"></i> Print / Save as PDF</button>
        </div>
        <p class="small text-secondary mt-2 mb-0">For a PDF: choose “Save as PDF” in your browser’s print dialog.</p>
      </div>
    </div>
  </section>
</main>

<footer id="siteFooter" class="site-footer"></footer>
<img id="certPrintImg" alt="Certificate" class="d-none">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="certificate.js"></script>
</body>
</html>

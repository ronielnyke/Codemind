<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Tracks — CODEMIND</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="tracks">
<div id="siteNav"></div>

<main>
  <div class="container page-head">
    <h1><i class="bi bi-grid-fill text-info"></i> Skill Tracks</h1>
    <p class="text-secondary mb-0">Answer every problem in a run correctly to pass. A wrong answer is not counted: you get a clue (not the answer) and a different problem takes its place. Finish all 9 tracks and 4 systems (13 total) to unlock your certificate.</p>
  </div>
  <section class="py-4">
    <div class="container">
      <div class="btn-group mb-3" role="group" id="trackFilter">
        <button class="btn btn-sm btn-outline-info active" data-f="all">All</button>
        <button class="btn btn-sm btn-outline-info" data-f="web">Web</button>
        <button class="btn btn-sm btn-outline-info" data-f="backend">Backend</button>
        <button class="btn btn-sm btn-outline-info" data-f="app">App</button>
        <button class="btn btn-sm btn-outline-info" data-f="system">Systems</button>
      </div>
      <div class="row g-3" id="trackGrid"></div>
    </div>
  </section>
</main>

<footer id="siteFooter" class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="tracks.js"></script>
</body>
</html>

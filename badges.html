<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Achievements — CODEMIND</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="badges">
<div id="siteNav"></div>

<main>
  <div class="container page-head">
    <h1><i class="bi bi-trophy-fill text-warning"></i> Achievements</h1>
    <p class="text-secondary mb-0">Unlock badges as you practice, and review your best score in every track.</p>
  </div>
  <section class="py-4">
    <div class="container">
      <div class="row g-3" id="badgeList"></div>
    </div>
  </section>
  <section class="py-4">
    <div class="container">
      <h2 class="fw-bold mb-3">Track results</h2>
      <div class="card"><div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Track</th><th>Status</th><th>Best</th><th>Attempts</th><th>Accuracy</th><th></th></tr></thead>
          <tbody id="resultRows"></tbody>
        </table>
      </div></div>
    </div>
  </section>
</main>

<footer id="siteFooter" class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="badges.js"></script>
</body>
</html>

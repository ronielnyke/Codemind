<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenge — CODEMIND</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body data-page="quiz">
<div id="siteNav"></div>

<main>
  <!-- Unknown track -->
  <section id="quizMissing" class="py-5 d-none">
    <div class="container text-center" style="max-width:560px">
      <div class="card"><div class="card-body p-5">
        <div class="display-4 text-warning mb-2"><i class="bi bi-exclamation-triangle-fill"></i></div>
        <h2 class="fw-bold">Track not found</h2>
        <p class="text-secondary">Choose a track from the Skill Tracks page.</p>
        <a href="tracks.html" class="btn btn-neon"><i class="bi bi-grid-fill"></i> Go to Tracks</a>
      </div></div>
    </div>
  </section>

  <!-- Question -->
  <section id="arena" class="py-5 d-none">
    <div class="container" style="max-width:860px">
      <div class="card arena-card">
        <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div><span class="badge text-bg-info" id="arTrack">Track</span> <span class="ms-2 small text-secondary" id="arCount">1/50</span></div>
          <div class="small">Score: <b id="arScore">0</b> • <button id="quitBtn" class="btn btn-sm btn-outline-danger"><i class="bi bi-x-lg"></i> Quit</button></div>
        </div>
        <div class="progress rounded-0" style="height:5px"><div id="arBar" class="progress-bar bg-info" style="width:0"></div></div>
        <div class="card-body p-4">
          <h4 id="arQ" class="mb-3"></h4>
          <pre id="arCode" class="code-box d-none"><code></code></pre>
          <div id="arOptions" class="d-grid gap-2"></div>
          <div id="arFeedback" class="alert mt-3 d-none" role="alert"></div>
          <div class="text-end mt-3"><button id="nextBtn" class="btn btn-neon d-none">Next <i class="bi bi-arrow-right"></i></button></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Result -->
  <section id="result" class="py-5 d-none">
    <div class="container text-center" style="max-width:640px">
      <div class="card arena-card"><div class="card-body p-5">
        <div id="resIcon" class="display-1 mb-2"></div>
        <h2 id="resTitle" class="fw-bold"></h2>
        <p id="resText" class="text-secondary"></p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <button id="resRetry" class="btn btn-neon"><i class="bi bi-arrow-repeat"></i> New Round</button>
          <a id="resNext" href="tracks.html" class="btn btn-outline-success d-none"><i class="bi bi-arrow-right-circle"></i> Next Track</a>
          <a id="resCert" href="certificate.html" class="btn btn-warning d-none"><i class="bi bi-award-fill"></i> Get Certificate</a>
          <a href="tracks.html" class="btn btn-outline-info"><i class="bi bi-grid"></i> Back to Tracks</a>
        </div>
      </div></div>
    </div>
  </section>
</main>

<footer id="siteFooter" class="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script src="quiz.js"></script>
</body>
</html>
